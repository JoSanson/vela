<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-label="Benchmark, lower is better. Launch → window on screen: Arc 2,116 ms, Vela 237 ms. Memory, 1 tab + 10 real sites: Arc 3,902 MB, Vela 2,635 MB, Vela + blocker 2,052 MB. Idle CPU, same 11 tabs: Arc 82.2 %, Vela 58.6 %, Vela + blocker 9.7 %. Tab switch, keystroke → frame: Arc 12.0 ms, Vela 6.5 ms.">
  <title>Arc vs Vela benchmark</title>
  <style>
    text { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .t { font-size: 15px; font-weight: 600; }
    .m, .f { fill: #59636e; font-size: 12px; }
    .c { font-weight: 600; fill: #1f2328; }
    .l { fill: #59636e; }
    .v { font-variant-numeric: tabular-nums; }
    .arc { fill: #eb6834; }
    .vela { fill: #2a78d6; }
    .hatch { fill-opacity: 0.4; stroke: #2a78d6; stroke-width: 1.5; }
    .axis { stroke: #d1d9e0; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      text, .c { fill: #f0f6fc; }
      .m, .f, .l { fill: #9198a1; }
      .arc { fill: #d95926; }
      .vela { fill: #3987e5; }
      .hatch { stroke: #3987e5; }
      .axis { stroke: #3d444d; }
    }
  </style>
