<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Video fixture</title>
  </head>
  <body style="font-family: sans-serif; padding: 24px">
    <h1>Video</h1>
    <video id="v" width="320" height="180" muted autoplay playsinline></video>
    <script>
      const canvas = document.createElement('canvas');
      canvas.width = 320;
      canvas.height = 180;
      const ctx = canvas.getContext('2d');
      let t = 0;
      setInterval(() => {
        t++;
        ctx.fillStyle = `hsl(${t % 360}, 70%, 50%)`;
        ctx.fillRect(0, 0, 320, 180);
      }, 50);
      const v = document.getElementById('v');
      v.srcObject = canvas.captureStream(20);
      v.play().catch(() => {});
    </script>
  </body>
</html>
