appId: app.vela.browser
productName: Vela
copyright: Copyright © 2026 Jordane Sanson
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - '**/*.node'
npmRebuild: false
nodeGypRebuild: false
electronLanguages:
  - en
  - fr
publish:
  provider: github
  owner: JoSanson
  repo: vela
  releaseType: release
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: resources/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: false
  extendInfo:
    CFBundleURLTypes:
      - CFBundleURLName: Web site URL
        CFBundleURLSchemes: [http, https]
    NSMicrophoneUsageDescription: Vela needs the microphone for sites that request it.
    NSCameraUsageDescription: Vela needs the camera for sites that request it.
    LSApplicationCategoryType: public.app-category.productivity
dmg:
  sign: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
linux:
  target:
    - AppImage
    - deb
  category: Network
  icon: resources/icons
  desktop:
    entry:
      MimeType: x-scheme-handler/http;x-scheme-handler/https;text/html;
      StartupWMClass: vela
protocols:
  - name: Vela URL
    schemes: [http, https]
    role: Viewer
