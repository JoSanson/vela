name: ✨ Feature idea
description: An idea that goes beyond what Arc did.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is slow, annoying or impossible today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Want to help build it?
      options:
        - label: I would like to work on this
